<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Fuentes de Google -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Ropa</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Tienda de Ropa</h1>
        <p>Registro de productos</p>
    </header>

    <main>
        <section class="formulario">
            <h2>Registrar una prenda</h2>

            <form id="productoForm">

                <label for="nombreProducto">Nombre del producto</label>
                <input 
                    type="text" 
                    id="nombreProducto" 
                    placeholder="Ej: Remera básica"
                    required
                >

                <label for="categoria">Categoría</label>
                <select id="categoria" required>
                    <option value="">Seleccionar categoría</option>
                    <option value="Remera">Remera</option>
                    <option value="Pantalón">Pantalón</option>
                    <option value="Campera">Campera</option>
                    <option value="Vestido">Vestido</option>
                    <option value="Buzo">Buzo</option>
                    <option value="Camisa">Camisa</option>
                    <option value="Short">Short</option>
                </select>

                <label for="talle">Talle</label>
                <input 
                    type="text" 
                    id="talle" 
                    placeholder="Ej: M"
                    required
                >

                <label for="color">Color</label>
                <input 
                    type="text" 
                    id="color" 
                    placeholder="Ej: Negro"
                    required
                >

                <label for="precio">Precio</label>
                <input 
                    type="number" 
                    id="precio" 
                    placeholder="Ej: 15000"
                    min="0"
                    step="0.01"
                    required
                >

                <button type="submit">Guardar producto</button>
            </form>

            <p id="mensaje"></p>
        </section>

<section class="productos">
    <h2>Productos registrados</h2>

    <div class="busqueda">
        <label for="busquedaProducto">
            Buscar producto por nombre
        </label>

        <div class="busqueda-controles">
            <input
                type="text"
                id="busquedaProducto"
                placeholder="Ej: Remera básica"
            >

            <button
                type="button"
                id="limpiarBusqueda"
            >
                Limpiar búsqueda
            </button>
        </div>
    </div>

    <div id="listaProductos">
        <p>Cargando productos...</p>
    </div>
</section>
    </main>

    <footer>
        <p>Tienda de Ropa - Firebase Realtime Database</p>
    </footer>

    <script type="module" src="script.js"></script>
</body>
</html>
